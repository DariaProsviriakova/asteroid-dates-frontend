name: Dates frontend checks

on:
  push:
  pull_request:

jobs:
  dates-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate-backend-types
      - run: git diff --exit-code -- src/api/generated
      - run: npm test
      - run: npm run build
